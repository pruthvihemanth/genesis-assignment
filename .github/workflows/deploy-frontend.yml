# Deploy Frontend to S3 + CloudFront
# Trigger on push to main/development when frontend changes, or manually via workflow_dispatch.

name: Deploy Frontend (S3 + CloudFront)

on:
  push:
    branches: [main, development]
    paths:
      - 'bond-yield-calculator/frontend/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build and deploy to CloudFront
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: bond-yield-calculator/frontend/package-lock.json

      - name: Install dependencies
        working-directory: bond-yield-calculator/frontend
        run: npm ci

      - name: Build
        working-directory: bond-yield-calculator/frontend
        run: npm run build
        env:
          CI: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # Option B: Access keys — uncomment and set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY; remove role-to-assume
          # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Sync to S3
        run: |
          aws s3 sync bond-yield-calculator/frontend/build/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "asset-manifest.json"
          aws s3 sync bond-yield-calculator/frontend/build/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "index.html" \
            --include "asset-manifest.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
